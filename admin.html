<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Store admin</title><link rel="stylesheet" href="admin.css"></head>
<body>
<section id="login" class="login" hidden><form id="loginForm" class="panel">
  <h1>Store admin</h1><label>Email<input id="email" type="email" autocomplete="username" required></label>
  <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
  <p id="loginErr" class="err" role="alert"></p><button class="btn">Log in</button></form></section>
<div id="app" hidden>
  <header class="top"><b id="storeName"></b><button class="btn out" id="logout">Log out</button></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Admin sections">
    <button data-tab="overview">Overview</button><button data-tab="products">Products</button>
    <button data-tab="categories">Categories</button><button data-tab="settings">Settings</button></nav>
</div>
<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="admin.js"></script>
</body></html>
